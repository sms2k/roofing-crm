version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: roofing-crm-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: roofing
      POSTGRES_PASSWORD: roofing123
      POSTGRES_DB: roofing_crm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U roofing']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: roofing-crm-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  maildev:
    image: maildev/maildev
    container_name: roofing-crm-maildev
    restart: unless-stopped
    ports:
      - '1080:1080' # Web UI
      - '1025:1025' # SMTP
    environment:
      MAILDEV_WEB_PORT: 1080
      MAILDEV_SMTP_PORT: 1025

volumes:
  postgres_data:
  redis_data:
